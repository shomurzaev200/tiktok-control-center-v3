services:
  postgres:
    image: postgres:16.4-alpine
    container_name: tt_v3_postgres
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: tt_v3_redis
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    env_file: .env
    command: >
      sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tiktok-control-backend:3.0.0
    container_name: tt_v3_backend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: .env
    volumes:
      - ./profiles:/app/profiles
      - ./backups:/app/backups
    expose:
      - "8000"
    networks:
      - backend_net
      - public_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    image: tiktok-control-backend:3.0.0
    container_name: tt_v3_worker
    command: python -m app.worker
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    env_file: .env
    volumes:
      - ./profiles:/app/profiles
    networks:
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/worker_healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  telegram:
    image: tiktok-control-backend:3.0.0
    container_name: tt_v3_telegram
    command: python -m app.telegram_monitor
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    env_file: .env
    networks:
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/tg_healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  backup:
    image: tiktok-control-backend:3.0.0
    container_name: tt_v3_backup
    command: python -m app.backup_runner
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: .env
    volumes:
      - ./backups:/app/backups
    networks:
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: tiktok-control-frontend:3.0.0
    container_name: tt_v3_frontend
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    ports:
      - "80:80"
      - "8080:8080"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    networks:
      - public_net
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  backend_net:
    driver: bridge
    internal: false
  public_net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
